# T07: a cada push na main ou na integracao roda os testes rápidos; o site (GitHub Pages) só publica da main e se ficarem verdes.
name: Testes e site
on:
  push:
    branches: [main, integracao]
  pull_request:
  workflow_dispatch:
  workflow_run:  # commit do robô de preços (GITHUB_TOKEN) não dispara push: republica quando ele termina
    workflows: ['Preços MYP']
    types: [completed]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: testa.py + partida + gabarito de planos
        run: python3 ferramentas/ci/verifica.py
      - name: tipos (svelte-check), Vitest e build do Vite (T43)
        # casos de regra com as cartas de banco/cartas (o que falta pula com aviso); fuzz pula sem cartas-rx.js
        run: npm ci && npm run check && npm test && npm run build
  site:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: testes
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publica.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: build do Vite (T43) → dist/
        run: npm ci && npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist }
      # actions/deploy-pages#451: o artefato demora a aparecer na listagem; espera até 2 min em vez de falhar
      - name: espera o artefato github-pages aparecer
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          for i in $(seq 24); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '[.artifacts[]|select(.name=="github-pages")]|length')
            [ "$n" -gt 0 ] && { echo "artefato visível após $((i*5)) s"; sleep 5; exit 0; }
            sleep 5
          done
          echo "artefato não apareceu em 2 min"; exit 1
      - id: publica
        uses: actions/deploy-pages@v5
