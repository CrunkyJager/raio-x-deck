# Preços em reais do MYP Cards (API pública), atualizados na nuvem do GitHub, sem depender de PC nenhum.
# Toda segunda às 6h (Brasília) ou na mão em Actions → "Preços MYP" → Run workflow.
# Token opcional: segredo MYP_TOKEN do repositório (sobe o limite de 10 para 60 pedidos/min: ~2 h → ~25 min).
name: Preços MYP

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: precos-myp
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Coletar preços do MYP Cards
        env:
          MYP_TOKEN: ${{ secrets.MYP_TOKEN }}
        run: python3 -I ferramentas/precos/coleta_myp.py --novo
      - name: Publicar o arquivo de preços
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add precos-myp.js
          if git diff --cached --quiet; then echo "preços iguais, nada a publicar"; exit 0; fi
          git commit -m "Preços do MYP Cards atualizados ($(date +%d/%m/%Y))"
          git pull --rebase origin main
          git push origin HEAD:main
