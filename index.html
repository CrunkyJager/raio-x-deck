<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Cole um deck de Commander e veja o que está bem montado, o que falta e quais cartas trocar.">
<title>Raio-X do Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0&icon_names=build,casino,category,flag,format_list_bulleted,insights,playing_cards,radiology,swap_horiz,water_drop&display=block">
<style>
/* Boletim sobre feltro: leitura de cima para baixo, prioridades primeiro. Tema escuro único, escolhido de propósito. */
:root {
  color-scheme: dark;
  --felt: #12211d; --felt-2: #182b26; --felt-3: #22382f; --line: #2f4a41;
  --ink: #ebe4d1; --ink-2: #b9b19b; --ink-3: #8a836f;
  --accent: #d2804e; --accent-2: #f0a574;
  --good: #7fc88e; --warn: #e0b04f; --bad: #e07a4f; --crit: #d4504a; --info: #6fb8cc;
  --mW: #f6f1d3; --mU: #a9d8f0; --mB: #c9bfbb; --mR: #f4a58a; --mG: #9fd1a9; --mC: #cfc6c2;
  --display: 'Alegreya Sans SC', 'Trebuchet MS', sans-serif;
  --body: 'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body { background: var(--felt); color: var(--ink); font: 16.5px/1.5 var(--body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 22px 60px; display: grid; gap: 16px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: .02em; margin: 0; text-wrap: balance; }
h1 { font-size: 2rem; }
h2 { font-size: 1.25rem; margin-bottom: 6px; }
button, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.note { color: var(--ink-3); font-size: .86rem; }
.lead { color: var(--ink-2); max-width: 68ch; margin: 0 0 12px; }
.panel { background: var(--felt-2); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
.btn { background: var(--felt-3); border: 1px solid var(--line); border-radius: 6px; padding: 7px 14px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1b120c; font-weight: 700; }
.btn.small { padding: 3px 9px; font-size: .88rem; }
textarea, select { background: var(--felt); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; color: var(--ink); }
textarea { width: 100%; min-height: 150px; font: 13px/1.45 var(--mono); resize: vertical; }
.field { display: inline-flex; gap: 8px; align-items: center; color: var(--ink-2); font-size: .9rem; margin-top: 8px; }
.intro { display: grid; gap: 6px; }
.intro p { margin: 0; color: var(--ink-2); max-width: 70ch; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }

/* cabeçalho do resultado */
.head { display: grid; gap: 10px; }
.cmdname { font-family: var(--display); font-size: 1.6rem; font-weight: 800; }
.ident { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.verdict { padding: 10px 14px; border-radius: 8px; font-weight: 700; border-left: 4px solid; background: var(--felt-3); }
.v-good { border-color: var(--good); } .v-ok { border-color: var(--info); } .v-warn { border-color: var(--warn); } .v-bad { border-color: var(--crit); }

/* prioridades */
.pri { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.pri li { padding-left: 4px; }
.sev { display: inline-block; font: 700 .72rem/1 var(--body); padding: 3px 7px; border-radius: 4px; color: #14110d; text-transform: uppercase; letter-spacing: .05em; }
.sev.s1 { background: var(--info); } .sev.s2 { background: var(--warn); } .sev.s3 { background: var(--crit); color: #fff; }
.area { color: var(--ink-3); font-size: .82rem; text-transform: uppercase; letter-spacing: .06em; margin-right: 4px; }
details { margin-top: 8px; }
summary { cursor: pointer; color: var(--accent-2); font-size: .92rem; }
.ask { margin-top: 12px; }
.ai-ans { margin-top: 10px; padding: 12px; background: var(--felt-3); border-radius: 8px; white-space: pre-wrap; max-width: 75ch; }

/* funções */
.refs { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.ref { border-top: 1px solid var(--line); padding-top: 10px; }
.ref p { margin: 6px 0 0; font-size: .92rem; color: var(--ink-2); }
.ref-h { display: flex; justify-content: space-between; align-items: baseline; }
.ref-h .num { font-size: 1.4rem; font-weight: 600; }
.st-ok { color: var(--good); } .st-low { color: var(--warn); } .st-high { color: var(--info); }
.gauge { position: relative; height: 10px; background: var(--felt-3); border-radius: 5px; margin: 6px 0 2px; }
.gauge .band { position: absolute; top: 0; bottom: 0; background: rgba(127, 200, 142, .25); border-radius: 5px; }
.gauge .mark { position: absolute; top: -3px; width: 4px; height: 16px; border-radius: 2px; transform: translateX(-2px); background: currentColor; }

/* cores */
.crow { display: grid; grid-template-columns: 22px 80px minmax(0, 1fr) 54px 92px; gap: 8px; align-items: center; padding: 4px 0; }
@media (max-width: 500px) { .crow { grid-template-columns: 22px minmax(0, 1fr) 54px; } .crow > span:nth-child(2), .crow > span:nth-child(5) { display: none; } }
.track { position: relative; height: 10px; background: var(--felt-3); border-radius: 5px; }
.track .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--good); border-radius: 5px; }
.track .fill.short { background: var(--warn); }
.track .need { position: absolute; top: -3px; width: 2px; height: 16px; background: var(--ink); }

/* temas */
.themes { display: grid; gap: 12px; }
.theme-h { display: flex; gap: 10px; align-items: baseline; }
.theme-h .num { margin-left: auto; color: var(--ink-2); }
.tag { display: inline-block; font-size: .74rem; padding: 2px 7px; border-radius: 99px; background: var(--felt-3); color: var(--ink-2); }
.tag.cmd { border: 1px solid var(--accent); color: var(--accent-2); background: none; }
.tag.th { color: var(--info); }
.links { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 6px; }
.cn { background: var(--felt-3); border: 1px solid transparent; border-radius: 4px; padding: 1px 7px; font-size: .86rem; cursor: pointer; color: var(--ink); }
.cn:hover { border-color: var(--accent); }
.big { font-size: 2.3rem; font-weight: 600; color: var(--accent-2); line-height: 1.1; }
.chart { width: 100%; height: auto; display: block; }
.ms { display: inline-grid; place-items: center; width: 1.15em; height: 1.15em; border-radius: 50%; font: 700 .7em/1 var(--mono); color: #1a1a1a; margin: 0 1px; vertical-align: -.12em; background: var(--mC); }
.ms.W { background: var(--mW); } .ms.U { background: var(--mU); } .ms.B { background: var(--mB); } .ms.R { background: var(--mR); } .ms.G { background: var(--mG); }
.ident .ms { width: 1.4em; height: 1.4em; }
.empty { color: var(--ink-3); padding: 24px; text-align: center; border: 1px dashed var(--line); border-radius: 8px; }
.pop { position: fixed; z-index: 30; width: min(620px, calc(100vw - 32px)); display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 14px; align-items: start; background: var(--felt-2); border: 1px solid var(--accent); border-radius: 10px; padding: 14px; box-shadow: 0 10px 40px rgba(0, 0, 0, .6); }
.pop h3 { font-size: 1.15rem; }
.pimg { width: 200px; aspect-ratio: 488 / 680; border-radius: 9px; overflow: hidden; background: var(--felt-3); display: grid; place-items: center; text-align: center; padding: 0; }
.pimg .note { padding: 10px; }
.pimg img { width: 100%; height: 100%; object-fit: cover; display: block; }
@media (max-width: 560px) { .pop { grid-template-columns: 1fr; max-height: calc(100vh - 32px); overflow-y: auto; top: 16px !important; } .pimg { width: 170px; margin: 0 auto; } }
.oracle { white-space: pre-wrap; font-size: .9rem; color: var(--ink-2); margin: 8px 0; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
#out { display: grid; gap: 16px; scroll-margin-top: 12px; }
#teste, .tout { display: grid; gap: 16px; scroll-margin-top: 12px; }
a.btn { text-decoration: none; color: var(--ink); }
.answer { border-color: var(--accent); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 6px 0 12px; }
.tile { background: var(--felt-3); border-radius: 8px; padding: 10px 12px; border-left: 4px solid var(--info); display: grid; gap: 2px; }
.tile b { font: 600 1.6rem/1.1 var(--mono); }
.tile span { font-size: .84rem; color: var(--ink-2); }
.tf-conta { width: 100%; border-collapse: collapse; margin: 4px 0 8px; font-size: .92rem; } .tf-conta td { padding: 4px 6px; border-bottom: 1px solid var(--line, rgba(255,255,255,.08)); } .tf-conta td.n { text-align: right; font-family: var(--mono); white-space: nowrap; } .tf-conta tr:last-child td { font-weight: 600; border-bottom: 0; }
.tile.good { border-color: var(--good); } .tile.warn { border-color: var(--warn); } .tile.bad { border-color: var(--bad); }
.sw { margin: 4px 0 8px; padding-left: 22px; display: grid; gap: 4px; }
.cbar { display: inline-block; width: 70px; height: 7px; background: var(--felt-3); border-radius: 4px; vertical-align: middle; margin-left: 6px; overflow: hidden; }
.cbar > span { display: block; height: 100%; }
.swapcard { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 700px) { .pair { grid-template-columns: 1fr; } }
.cbox { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px; align-items: start; position: relative; }
.cimg { width: 150px; aspect-ratio: 488 / 680; border-radius: 7px; overflow: hidden; background: var(--felt-3); display: grid; place-items: center; }
.cimg img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ctag { position: absolute; left: 6px; top: 6px; z-index: 1; font: 700 .72rem/1 var(--body); padding: 4px 8px; border-radius: 4px; letter-spacing: .06em; }
.ctag.out { background: var(--crit); color: #fff; } .ctag.in { background: var(--good); color: #14110d; }
a.btn.primary { color: #1b120c; }
.prog { margin-top: 12px; display: grid; gap: 4px; }
.prog > div { height: 8px; width: 0; background: var(--accent); border-radius: 4px; transition: width .2s; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .84rem; color: var(--ink-2); margin: 4px 0 10px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.cn.lock.on { border-color: var(--info); color: var(--info); }
table.heat td { text-align: center; font-size: .85rem; }
table.heat th.rot { height: 120px; vertical-align: bottom; white-space: nowrap; }
table.heat th.rot span { display: inline-block; transform: rotate(-55deg); transform-origin: left bottom; width: 24px; font-size: .78rem; }
.panel h3 { font-family: var(--display); font-size: 1.05rem; margin: 14px 0 6px; }
.tw table { border-collapse: collapse; width: 100%; font-size: .9rem; }
.tw th, .tw td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tw th { font-family: var(--display); font-weight: 500; color: var(--ink-2); }
.tw td.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tw { overflow-x: auto; }
/* telas */
.tabs { position: sticky; top: 0; z-index: 20; display: flex; gap: 4px; overflow-x: auto; background: var(--felt); padding: 8px 0; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
.tabs a { flex: none; padding: 7px 13px; border-radius: 6px; color: var(--ink-2); text-decoration: none; border: 1px solid transparent; font-family: var(--display); font-weight: 500; letter-spacing: .02em; }
.tabs a:hover { color: var(--ink); border-color: var(--line); }
.tabs a[aria-current="page"] { background: var(--felt-3); color: var(--accent-2); border-color: var(--accent); }
#out .screen { display: grid; gap: 16px; }
.sw-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 10px; }
.sw-h h3 { margin: 0 !important; }
.swapcard.off .pair, .swapcard.off .why, .swapcard.off .alt { opacity: .4; }
.why { margin: 10px 0 0; color: var(--ink-2); font-size: .94rem; max-width: 80ch; }
.why b { color: var(--ink); }
.alt { margin-top: 8px; }
.cbox .cn { padding: 0; background: none; font-size: 1rem; text-align: left; }
.cimg .note { padding: 8px; text-align: center; }
@media (max-width: 500px) { .cbox { grid-template-columns: 110px minmax(0, 1fr); } .cimg { width: 110px; } }

.cimg img, .pimg img { cursor: zoom-in; }
.zoom { position: fixed; inset: 0; z-index: 50; background: rgba(5, 10, 8, .82); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) 16px 16px; overflow-y: auto; }
.zoom-box { position: relative; display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 420px); gap: 22px; align-items: start; background: var(--felt-2); border: 1px solid var(--accent); border-radius: 12px; padding: 20px; max-width: 940px; width: 100%; }
.zoom-img img { width: 100%; height: auto; border-radius: 16px; display: block; }
.zoom-txt h3 { font-size: 1.5rem; margin-bottom: 6px; padding-right: 90px; }
.zoom-oracle { font-size: 1.12rem; line-height: 1.55; color: var(--ink); }
.zoom-txt p { font-size: 1.02rem; }
.zoom-x { position: absolute; top: 12px; right: 12px; }
@media (max-width: 760px) { .zoom-box { grid-template-columns: 1fr; padding: 14px; } .zoom-img { max-width: 360px; margin: 30px auto 0; width: 100%; } .zoom-txt h3 { padding-right: 0; } }
.hov { position: fixed; z-index: 40; width: 360px; display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 10px; background: var(--felt-2); border: 1px solid var(--accent); border-radius: 10px; padding: 10px; box-shadow: 0 10px 30px rgba(0, 0, 0, .55); pointer-events: none; font-size: .92rem; }
.hov-img { width: 130px; aspect-ratio: 488 / 680; border-radius: 6px; overflow: hidden; background: var(--felt-3); display: grid; place-items: center; }
.hov-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.why.cmp { border-left: 3px solid var(--accent); padding-left: 10px; }
.conc textarea { margin-top: 4px; }
.cc-row { margin: 10px 0 4px; }
.cc-box { display: grid; gap: 4px; }
.cc-box b { font-family: var(--display); font-weight: 500; }
.ops { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.op { display: flex; gap: 8px; align-items: center; background: var(--felt-3); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
.op.on { border-color: var(--accent); }
.op > span { display: grid; flex: 1; min-width: 0; }
.op b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
input.txt { background: var(--felt); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; color: var(--ink); font: inherit; min-width: 260px; }
.crow2 { display: grid; grid-template-columns: minmax(0, 1fr) 110px 44px; gap: 8px; align-items: center; padding: 3px 0; font-size: .92rem; }
.crow2 .cbar { width: 110px; margin: 0; }
.vivo { display: grid; gap: 12px; }
.vctl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.vctl input[type=range] { flex: 1; min-width: 160px; accent-color: var(--accent); }
.vlance { display: flex; gap: 10px; align-items: center; background: var(--felt-3); border-left: 4px solid var(--accent); border-radius: 8px; padding: 10px 14px; font-size: 1.05rem; min-height: 48px; }
.vt { display: inline-grid; place-items: center; width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--felt); color: var(--accent-2); font-size: .9em; flex: none; }
.vt.remo, .vt.wipe, .vt.morte { color: var(--bad); } .vt.resp, .vt.bloqueio { color: var(--info); } .vt.combo, .vt.fim { color: var(--warn); } .vt.terreno { color: var(--good); }
/* T22 motor novo (beta): gatilho, efeito, camadas (P/R e palavras-chave) e habilidade ativada */
.vt.gatilho, .vt.habil { color: var(--warn); } .vt.camada { color: var(--good); } .vt.efeito { color: var(--info); }
.v-beta { display: inline-flex; align-items: center; gap: 6px; font-size: .9em; } .v-beta small { color: var(--muted, #8a8f98); }
.vgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.vgrid.n2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 760px) { .vgrid { grid-template-columns: 1fr; } }
.vj { background: var(--felt); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; align-content: start; position: relative; transition: border-color .2s, box-shadow .2s; }
.vj.vez { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.vj.alvo { border-color: var(--bad); }
.vj.morto { opacity: .45; }
.vj-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.vj-h b { font-family: var(--display); font-size: 1.05rem; }
.vida { color: var(--bad); font-size: 1.15rem; font-weight: 600; }
.vj-p { display: flex; flex-wrap: wrap; gap: 4px; }
.vc { background: var(--felt-3); border: 1px solid var(--line); border-radius: 5px; padding: 2px 7px; font-size: .84rem; color: var(--ink); cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline; }
.vc:hover { border-color: var(--accent); }
.vc.cmd { border-color: var(--accent); color: var(--accent-2); }
.vc.tok { border-style: dashed; cursor: default; color: var(--ink-2); }
.vc.tap { opacity: .6; transform: rotate(-2deg); }
.vc.atk { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad) inset; }
.vc .pt { font: 600 .78rem/1 var(--mono); color: var(--ink-2); }
.vj-x { position: absolute; right: 10px; bottom: 8px; font-size: .8rem; color: var(--bad); text-transform: uppercase; letter-spacing: .06em; }
.vlog ol { margin: 8px 0 0; padding-left: 0; list-style: none; display: grid; gap: 4px; max-height: 280px; overflow-y: auto; font-size: .92rem; color: var(--ink-2); }
.vlog li { display: flex; gap: 8px; align-items: center; }

/* ---------- refinamento visual: mais respiro, hierarquia clara, uma cor por área ---------- */
body { font-size: 17px; line-height: 1.6; }
.wrap { max-width: 1180px; gap: 28px; padding-block: 36px 72px; }
.intro { gap: 10px; }
.eyebrow { font: 500 .78rem/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.intro h1 { font-size: clamp(2.2rem, 4.6vw, 3.2rem); line-height: 1.05; letter-spacing: .01em; }
.intro h1 span { color: var(--accent-2); }
.intro p { font-size: 1.06rem; max-width: 64ch; }
h2 { font-size: 1.45rem; margin-bottom: 4px; }
.panel h3 { font-size: 1.12rem; margin: 22px 0 8px; }
.lead { margin: 2px 0 16px; max-width: 70ch; line-height: 1.6; }
.note { font-size: .88rem; line-height: 1.5; }
.panel { padding: 24px 26px 26px; border-radius: 12px; border-top: 3px solid var(--c, var(--line)); }
@media (max-width: 600px) { .panel { padding: 18px 16px 20px; } body { font-size: 16px; } }
#out .screen, .tout { gap: 22px; }
.grid2 { gap: 22px; }
/* cor de cada área, no filete de cima dos painéis */
[data-s="lista"] { --c: var(--accent); }
[data-s="resumo"] .panel { --c: var(--accent); }
[data-s="trocas"] .panel { --c: var(--warn); }
[data-s="funcoes"] .panel { --c: var(--good); }
[data-s="mana"] .panel { --c: var(--info); }
[data-s="plano"] .panel { --c: #b79be0; }
[data-s="mesa"] .panel, [data-s="aovivo"] .panel { --c: #e07a9a; }
.panel.answer { border-color: var(--line); border-top-color: var(--c, var(--accent)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--c, var(--accent)) 35%, transparent) inset; }

/* abas: sublinhado, agrupadas, número em mono */
.tabs { gap: 2px; padding: 0; background: color-mix(in srgb, var(--felt) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); align-items: stretch; }
.tabs .tg { flex: none; align-self: center; font: 500 .7rem/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); padding: 0 6px 0 14px; }
.tabs .tg:first-child { padding-left: 0; }
.tabs a { border: 0; border-radius: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; padding: 13px 12px 11px; display: inline-flex; gap: 7px; align-items: baseline; font-size: 1rem; }
.tabs a i { font: 500 .72rem/1 var(--mono); font-style: normal; color: var(--ink-3); }
.tabs a:hover { border-color: var(--line); background: none; }
.tabs a[aria-current="page"] { background: none; border-bottom-color: var(--accent); color: var(--ink); }
.tabs a[aria-current="page"] i { color: var(--accent-2); }

/* resumo */
.verdict { padding: 14px 18px; font-size: 1.05rem; border-radius: 10px; }
.pri { gap: 12px; }
.pri li { line-height: 1.55; }
.sev { padding: 4px 8px; border-radius: 4px; font: 600 .68rem/1 var(--mono); letter-spacing: .08em; }
.area { font: 500 .72rem/1 var(--mono); letter-spacing: .08em; }

/* funções */
.refs { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 22px 28px; }
.ref { padding-top: 14px; }
.ref p { line-height: 1.55; }

/* tabelas no padrão: cabeçalho em mono, linhas arejadas */
.tw { border: 1px solid var(--line); border-radius: 10px; background: var(--felt); }
.tw table { font-size: .93rem; }
.tw th { font: 500 .72rem/1.2 var(--mono); text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); padding: 11px 14px; }
.tw td { padding: 10px 14px; }
.tw tr:last-child td { border-bottom: 0; }

/* trocas */
.swapcard { background: var(--felt); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px 20px; margin-top: 18px; }
.swapcard + .swapcard { margin-top: 16px; }
.sw-h { margin-bottom: 16px; }
.sw-h h3 { font-size: 1.15rem; }
.pair { gap: 22px; }
.cbox { gap: 16px; }
.why { margin-top: 16px; line-height: 1.6; }
dl.sw-why { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 10px 18px; margin: 18px 0 0; max-width: 92ch; }
dl.sw-why dt { font: 500 .72rem/1.9 var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
dl.sw-why dd { margin: 0; color: var(--ink-2); line-height: 1.6; }
dl.sw-why dd.cmp { color: var(--ink); border-left: 3px solid var(--accent); padding-left: 12px; }
@media (max-width: 600px) { dl.sw-why { grid-template-columns: 1fr; gap: 2px; } dl.sw-why dd { margin-bottom: 10px; } }
.alt { margin-top: 14px; display: grid; gap: 6px; }
.conc .cc-row { margin: 16px 0 10px; display: grid; gap: 8px; }
.cc-box { gap: 6px; }

/* listas de cartas */
.links { gap: 6px 7px; }
.cn { padding: 3px 9px; border-radius: 5px; font-size: .9rem; }

/* números */
.tiles { gap: 14px; margin: 8px 0 22px; }
.tile { padding: 14px 16px; border-radius: 10px; gap: 6px; }
.tile b { font-size: 1.85rem; }

/* mesa simulada */
.ops { gap: 10px; }
.op { padding: 10px 12px; border-radius: 10px; }
.vgrid { gap: 14px; }
.vj { padding: 14px 16px; gap: 8px; border-radius: 12px; }
.vlance { padding: 14px 18px; border-radius: 10px; }
.noimg { display: grid; place-items: center; width: 100%; height: 100%; padding: 10px; text-align: center; font: 600 .82rem/1.3 var(--display); color: var(--ink-2); background: repeating-linear-gradient(135deg, var(--felt-3) 0 10px, var(--felt-2) 10px 20px); }
@media (max-width: 600px) { .swapcard { padding: 14px 12px 16px; } .sw-h { gap: 8px; } .tabs a { padding: 12px 9px 10px; } }

/* ---------- Mesa ao vivo: a mesa com as cartas ---------- */
.arena { display: grid; gap: 14px; }
.vctl { position: sticky; top: 52px; z-index: 15; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px 12px; background: color-mix(in srgb, var(--felt-2) 94%, transparent); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 12px; }
.vb { background: var(--felt-3); border: 1px solid var(--line); border-radius: 8px; color: var(--ink); min-width: 38px; height: 36px; padding: 0 10px; cursor: pointer; font-size: .95rem; }
.vb:hover { border-color: var(--accent); }
.vb.play { background: var(--accent); border-color: var(--accent); color: #1b120c; font-weight: 700; min-width: 108px; }
.vsel { height: 36px; padding: 0 8px; }
.vctl input[type=range] { flex: 1; min-width: 140px; accent-color: var(--accent); }
.vpos { font: 500 .8rem/1 var(--mono); color: var(--ink-3); min-width: 110px; text-align: right; }
.feltro { position: relative; display: grid; gap: 14px; padding: 18px; border-radius: 22px; border: 1px solid #2c4a3f;
  background: radial-gradient(ellipse at 50% 50%, #1f4a3b 0%, #173a2f 45%, #102a22 100%);
  box-shadow: inset 0 0 0 6px #0c1f19, inset 0 0 80px rgba(0, 0, 0, .45), 0 18px 40px rgba(0, 0, 0, .35);
  grid-template-columns: minmax(0, 1fr) minmax(220px, 300px) minmax(0, 1fr);
  grid-template-areas: "left top right" "left center right" "me me me"; }
.arena.n2 .feltro { grid-template-columns: minmax(0, 1fr) minmax(220px, 300px); grid-template-areas: "top center" "me center"; }
@media (max-width: 900px) { .feltro, .arena.n2 .feltro { grid-template-columns: 1fr; grid-template-areas: "center" "top" "left" "right" "me"; padding: 10px; } }
.seat { min-width: 0; }
.seat-in { position: relative; height: 100%; display: grid; gap: 8px; align-content: start; padding: 12px 14px 14px; border-radius: 16px; background: rgba(8, 20, 16, .42); border: 1px solid rgba(255, 255, 255, .06); transition: box-shadow .25s, border-color .25s, opacity .3s; }
.seat-in.vez { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 26px rgba(210, 128, 78, .28); }
.seat-in.alvo { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad), 0 0 24px rgba(224, 122, 79, .3); }
.seat-in.morto { opacity: .38; filter: grayscale(.7); }
.s-h { display: flex; align-items: center; gap: 10px; }
.s-av { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--accent); background: var(--felt-3) center/cover no-repeat; cursor: pointer; padding: 0; box-shadow: 0 2px 8px rgba(0, 0, 0, .4); }
.me .s-av { width: 56px; height: 56px; }
.s-n { display: grid; min-width: 0; flex: 1; line-height: 1.2; }
.s-n b { font-family: var(--display); font-size: 1.08rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.s-n span { font-size: .8rem; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.s-v { position: relative; flex: none; display: grid; place-items: center; min-width: 58px; height: 46px; padding: 0 10px; border-radius: 12px; background: rgba(0, 0, 0, .35); border: 1px solid rgba(255, 255, 255, .08); }
.s-v span { font: 700 1.55rem/1 var(--mono); color: var(--ink); }
.s-v i { position: absolute; right: -6px; top: -10px; font: 700 .8rem/1 var(--mono); font-style: normal; padding: 3px 6px; border-radius: 6px; animation: flutua 1.2s ease-out forwards; }
.s-v.baixou i { background: var(--crit); color: #fff; } .s-v.subiu i { background: var(--good); color: #10241a; }
.s-v.baixou span { color: #ff9c8a; } .s-v.subiu span { color: var(--good); }
@keyframes flutua { from { transform: translateY(6px); opacity: 0; } 20% { opacity: 1; } to { transform: translateY(-6px); opacity: .9; } }
.s-st { display: flex; flex-wrap: wrap; gap: 4px 12px; font: 500 .76rem/1.3 var(--mono); color: var(--ink-3); }
.s-st .z { color: var(--accent-2); }
.s-lands { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.lp { display: inline-flex; align-items: center; gap: 4px; background: rgba(0, 0, 0, .25); border-radius: 999px; padding: 2px 8px 2px 3px; }
.lp b { font: 600 .82rem/1 var(--mono); }
.lp .ms { width: 1.25em; height: 1.25em; font-size: .78rem; display: inline-grid; place-items: center; color: #333; }
.ms.multi { background: conic-gradient(var(--mW), var(--mU), var(--mB), var(--mR), var(--mG), var(--mW)); }
.s-bf { display: flex; flex-wrap: wrap; gap: 8px 6px; align-items: flex-end; min-height: 20px; }
.s-bf .vazio { font-size: .8rem; color: rgba(235, 228, 209, .3); font-style: italic; }
/* carta */
.mcw { --w: 62px; display: inline-flex; justify-content: center; align-items: flex-end; width: var(--w); transition: width .25s; }
.me .mcw { --w: 78px; }
.mcw.tap { width: calc(var(--w) * 1.36); }
.s-bf.out .mcw { --w: 46px; }
.me .s-bf.out .mcw { --w: 54px; }
.mc { position: relative; display: block; width: var(--w); aspect-ratio: 488 / 680; padding: 0; border: 0; border-radius: calc(var(--w) * .06); background: #111; cursor: pointer; overflow: visible; box-shadow: 0 3px 8px rgba(0, 0, 0, .5); transition: transform .3s ease, box-shadow .2s; flex: none; }
.mc img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; display: block; }
.mc:hover { box-shadow: 0 0 0 2px var(--accent-2), 0 6px 14px rgba(0, 0, 0, .6); z-index: 2; }
.mc.tap { transform: rotate(90deg) translateX(calc(var(--w) * -.12)); }
.mc.atk { transform: translateY(-10px); box-shadow: 0 0 0 2px var(--crit), 0 0 18px rgba(212, 80, 74, .65); }
.mc.cmd { box-shadow: 0 0 0 2px #e7b55c, 0 0 14px rgba(231, 181, 92, .5); }
.mc.novo { animation: entra .45s cubic-bezier(.2, .9, .3, 1.3); }
@keyframes entra { from { transform: translateY(-14px) scale(.7); opacity: 0; } to { opacity: 1; } }
.mc.tap.novo { animation: none; }
.mpt { position: absolute; right: -4px; bottom: -6px; font: 700 .7rem/1 var(--mono); background: #f2ead6; color: #1a1612; border-radius: 5px; padding: 3px 4px; box-shadow: 0 1px 3px rgba(0, 0, 0, .6); }
.me .mpt { font-size: .78rem; }
.mc.tap .mpt { transform: rotate(-90deg); }
.mtok { display: grid; align-content: center; gap: 2px; width: 100%; height: 100%; padding: 4px; border-radius: inherit; text-align: center; background: linear-gradient(160deg, #3b4a44, #1f2a26); border: 1px dashed rgba(235, 228, 209, .45); }
.mtok b { font: 600 .58rem/1.15 var(--body); color: var(--ink); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; }
.me .mtok b { font-size: .66rem; }
.mtok i { font: 500 .52rem/1 var(--mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; font-style: normal; }
.mtok.big b { font-size: 1rem; -webkit-line-clamp: 6; }
/* mão */
.s-mao { display: flex; justify-content: center; padding: 10px 0 2px; margin-top: 4px; border-top: 1px dashed rgba(255, 255, 255, .08); }
.s-mao > span { transform: rotate(var(--r)) translateY(calc(var(--r) * var(--r) * .12deg / 1deg * 1px)); margin: 0 -6px; transition: transform .2s; }
.s-mao > span:hover { transform: translateY(-14px) scale(1.12); z-index: 3; }
.s-mao .mcw { --w: 70px; }
.s-dorso { display: flex; justify-content: center; padding-top: 4px; }
.s-dorso i { width: 22px; height: 31px; margin: 0 -5px; border-radius: 3px; transform: rotate(var(--r)); background: radial-gradient(circle at 50% 50%, #7a4a2a 0 22%, #3c2416 23% 30%, #6b3f22 31%); border: 1.5px solid #2a180e; box-shadow: 0 1px 3px rgba(0, 0, 0, .5); }
.s-x { position: absolute; inset: 0; display: grid; place-items: center; font: 700 .9rem/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--bad); pointer-events: none; }
/* centro: o lance da vez */
.centro { display: grid; place-items: center; min-height: 260px; }
.c-ev, .c-vazio { display: grid; justify-items: center; gap: 10px; text-align: center; padding: 14px; border-radius: 18px; background: rgba(0, 0, 0, .28); border: 1px solid rgba(255, 255, 255, .06); width: 100%; animation: aparece .3s ease; }
@keyframes aparece { from { opacity: .3; transform: scale(.97); } }
.c-k { display: inline-flex; gap: 8px; align-items: center; font: 500 .74rem/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.c-card { width: 170px; aspect-ratio: 488 / 680; padding: 0; border: 0; background: #111; border-radius: 9px; cursor: zoom-in; box-shadow: 0 10px 30px rgba(0, 0, 0, .6); }
.c-card img { width: 100%; height: 100%; object-fit: cover; border-radius: 9px; display: block; }
.c-ev.remo .c-card, .c-ev.wipe .c-card { box-shadow: 0 0 0 2px var(--crit), 0 10px 30px rgba(212, 80, 74, .45); }
.c-ev.combo .c-card, .c-ev.fim .c-card { box-shadow: 0 0 0 2px #e7b55c, 0 10px 30px rgba(231, 181, 92, .45); }
.c-txt { margin: 0; font-size: .98rem; line-height: 1.45; max-width: 30ch; }
.c-vazio p { margin: 0; color: var(--ink-2); }
.zoom-box.solo { grid-template-columns: minmax(0, 480px); justify-content: center; max-width: 520px; }

/* mesa: os 3 oponentes lado a lado com o mesmo espaço, o lance numa faixa no meio, você embaixo */
.feltro { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-areas: "left top right" "center center center" "me me me"; }
.arena.n2 .feltro { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "center" "me"; }
.seat.left .seat-in, .seat.top .seat-in, .seat.right .seat-in { min-height: 230px; }
.centro { min-height: 0; }
.c-ev, .c-vazio { grid-template-columns: auto minmax(0, 1fr); justify-items: start; align-items: center; text-align: left; gap: 6px 18px; max-width: 720px; margin: 0 auto; padding: 12px 18px; }
.c-ev .c-k { grid-column: 2; align-self: end; }
.c-ev .c-card { grid-row: 1 / span 2; width: 112px; }
.c-ev .c-txt { grid-column: 2; align-self: start; max-width: 52ch; font-size: 1.02rem; }
.c-ev:not(:has(.c-card)) { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; }
.c-ev:not(:has(.c-card)) .c-k, .c-ev:not(:has(.c-card)) .c-txt { grid-column: 1; }
.c-vazio { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; }
@media (max-width: 900px) { .feltro { grid-template-columns: minmax(0, 1fr); grid-template-areas: "center" "top" "left" "right" "me"; } .seat.left .seat-in, .seat.top .seat-in, .seat.right .seat-in { min-height: 0; } }

/* carta virada: ocupa um quadrado do tamanho da altura da carta, sem invadir as vizinhas */
.mcw { position: relative; height: calc(var(--w) * 1.394); align-items: flex-end; }
.mcw.tap { width: calc(var(--w) * 1.394); }
.mcw.tap .mc { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(90deg); }
.mcw.tap .mc.atk { transform: translate(-50%, calc(-50% - 8px)) rotate(90deg); }
.mc.tap .mpt { transform: rotate(-90deg); right: auto; left: -8px; bottom: -4px; }
.s-bf { gap: 10px 8px; }

/* ================= estética do mapa visual (18/11/2026) =================
   Quadro azul-noite com grade de pontos e brilho no centro, pílulas em degradê com ícone,
   núcleo com anel colorido, destaque dourado, uma cor (--h) por tela. Fica por último: vale sobre tudo acima. */
:root {
  --felt: #121521; --felt-2: #171b2a; --felt-3: #20263a; --line: #2c3247;
  --ink: #eef0f6; --ink-2: #c6cbd9; --ink-3: #9aa2b4;
  --accent: #ffc23d; --accent-2: #ffd36b; --gold-ink: #1a1300;
  --good: #5cd68f; --warn: #f5b53f; --bad: #ff7d5c; --crit: #ff5d6c; --info: #6cb8ff;
  --display: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
  --body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
  --h: 44; --c: hsl(var(--h) 85% 64%);
}
html { min-height: 100%; background-color: #0b0d15; background-image:
    radial-gradient(circle, rgb(255 255 255 / .055) 1.2px, transparent 1.6px),
    radial-gradient(ellipse 120% 1400px at 50% 0%, #20253a 0%, #121521 55%, #0b0d15 100%);
  background-size: 24px 24px, 100% 100%; background-repeat: repeat, no-repeat; }
body { background: transparent; font-family: var(--body); font-size: 16.5px; }
h1, h2, h3 { font-family: var(--display); }
.ic { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; line-height: 1; letter-spacing: normal; text-transform: none; white-space: nowrap; direction: ltr; -webkit-font-smoothing: antialiased; font-feature-settings: 'liga'; font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24; }
.icwait .ic { visibility: hidden; }
.noicons .ic { display: none !important; }

/* cor de cada tela */
[data-s="lista"] { --h: 44; }
[data-s="resumo"] { --h: 212; }
[data-s="trocas"] { --h: 24; }
[data-s="funcoes"] { --h: 142; }
[data-s="mana"] { --h: 186; }
[data-s="plano"] { --h: 268; }
[data-s="mesa"] { --h: 318; }
[data-s="aovivo"] { --h: 352; }
[data-s] .panel, .panel[data-s] { --c: hsl(var(--h) 85% 64%); }

/* cabeçalho: o núcleo do mapa */
.hero { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 34px; align-items: center; padding: 34px 36px; border-radius: 22px; overflow: hidden;
  border: 1px solid var(--line);
  background: radial-gradient(circle, rgb(255 255 255 / .07) 1.2px, transparent 1.6px) 0 0 / 24px 24px,
    radial-gradient(ellipse at 14% 50%, #262c47 0%, #161a29 55%, #0e1019 100%);
  box-shadow: 0 20px 60px rgb(0 0 0 / .35); }
.hero-tx { display: grid; gap: 10px; min-width: 0; }
.hub { position: relative; width: 190px; height: 190px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; color: var(--ink);
  border: 9px solid transparent;
  background: radial-gradient(circle at 50% 38%, #232842, #171b2a 72%) padding-box,
    conic-gradient(from 200deg, hsl(205 85% 60%), hsl(232 85% 64%), hsl(282 80% 64%), hsl(318 80% 62%), hsl(352 82% 60%), hsl(16 88% 58%), hsl(36 90% 55%), hsl(88 70% 48%), hsl(142 65% 48%), hsl(178 75% 45%), hsl(205 85% 60%)) border-box;
  box-shadow: 0 18px 50px rgb(0 0 0 / .4), 0 0 120px 30px rgb(91 108 255 / .22); }
.hub .ic { font-size: 44px; color: var(--accent); filter: drop-shadow(0 0 10px rgb(255 194 61 / .5)); }
.hub b { font-family: var(--display); font-size: 26px; font-weight: 700; line-height: 1; }
.hub small { font-size: 12.5px; color: var(--ink-3); line-height: 1.35; }
.intro h1 { font-size: clamp(2.3rem, 4.8vw, 3.4rem); font-weight: 700; letter-spacing: .01em; }
.intro h1 span { color: transparent; background: linear-gradient(95deg, #ffc23d, hsl(16 88% 62%) 60%, hsl(338 80% 64%)); -webkit-background-clip: text; background-clip: text; }
.intro p { color: var(--ink-2); }
.eyebrow { color: var(--ink-3); font-family: var(--mono); }
@media (max-width: 700px) {
  .hero { grid-template-columns: minmax(0, 1fr); padding: 24px 20px; gap: 20px; }
  .hub { width: 92px; height: 92px; border-width: 6px; box-shadow: 0 10px 30px rgb(0 0 0 / .4), 0 0 60px 14px rgb(91 108 255 / .2); } .hub .ic { font-size: 24px; } .hub b { font-size: 14px; } .hub small { display: none; }
}

/* abas: pílulas; a da tela aberta acende no degradê da sua cor */
.wrap { max-width: 1240px; }
.tabs { top: 10px; gap: 2px; padding: 6px; flex-wrap: nowrap; justify-content: safe center; overflow-x: auto; scrollbar-width: none; border: 1px solid var(--line); border-radius: 999px; align-items: center;
  background: rgb(18 21 33 / .86); backdrop-filter: blur(10px); box-shadow: 0 12px 34px rgb(0 0 0 / .35); }
.tabs::-webkit-scrollbar { display: none; }
.tabs .tg { font-size: 0; width: 1px; height: 22px; padding: 0; margin: 0 6px; background: var(--line); }
.tabs .tg:first-child { display: none; }
.tabs a { --hc: hsl(var(--h) 85% 66%); border: 0; margin: 0; border-radius: 999px; padding: 5px 13px 5px 5px; align-items: center; gap: 7px; color: var(--ink-2); font-family: var(--display); font-weight: 600; font-size: .96rem; transition: background .2s, color .2s, box-shadow .2s; }
.tabs a .ic { display: grid; place-items: center; width: 27px; height: 27px; border-radius: 50%; font-size: 17px; color: var(--hc); background: color-mix(in srgb, var(--hc) 14%, transparent); }
.noicons .tabs a { padding-left: 13px; }
.tabs a i { display: none; }
.noicons .tabs a i { display: inline; font-family: var(--mono); color: var(--ink-3); font-size: .68rem; }
.tabs a:hover { background: var(--felt-3); color: var(--ink); border: 0; }
.tabs a[aria-current="page"] { color: #fff; background: linear-gradient(135deg, hsl(var(--h) 80% 54%), hsl(calc(var(--h) + 18) 72% 42%)); box-shadow: 0 8px 22px hsl(var(--h) 70% 35% / .45); }
.tabs a[aria-current="page"] .ic { color: #fff; background: rgb(255 255 255 / .22); }
.tabs a[aria-current="page"] i { color: rgb(255 255 255 / .75); }
@media (max-width: 600px) { .tabs { top: 6px; justify-content: flex-start; } .tabs a { padding: 5px 12px 5px 5px; } .tabs a .ic { width: 26px; height: 26px; font-size: 17px; } }

/* painéis: cartão escuro com filete grosso da cor da tela */
.panel { position: relative; background: linear-gradient(180deg, color-mix(in srgb, var(--c, var(--line)) 7%, var(--felt-2)) 0, var(--felt-2) 160px);
  border: 1px solid var(--line); border-top: 5px solid var(--c, var(--line)); border-radius: 18px; box-shadow: 0 18px 50px rgb(0 0 0 / .3); }
.panel > h2 { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 1.5rem; }
.panel > h2::before { content: ""; flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--c, var(--accent)); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c, var(--accent)) 22%, transparent), 0 0 16px var(--c, var(--accent)); }
.panel h3 { font-weight: 600; }
.panel.answer { box-shadow: 0 18px 50px rgb(0 0 0 / .3), 0 0 0 1px color-mix(in srgb, var(--c) 35%, transparent) inset; }
.big { color: var(--c, var(--accent-2)); font-family: var(--display); font-weight: 700; text-shadow: 0 0 24px color-mix(in srgb, var(--c, var(--accent)) 40%, transparent); }
.cmdname { font-family: var(--display); font-weight: 700; font-size: 1.85rem; }

/* botões: dourado como o “continuar” do mapa */
.btn { border-radius: 999px; padding: 8px 16px; background: var(--felt-3); border-color: var(--line); transition: border-color .15s, filter .15s; }
.btn:hover { border-color: var(--accent); }
.btn.primary, a.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--gold-ink); box-shadow: 0 6px 20px rgb(255 194 61 / .25); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: 4px 11px; }
.btn[disabled] { opacity: .45; cursor: default; }
textarea, select, input.txt { background: #0f1220; border-color: var(--line); border-radius: 12px; }
textarea { padding: 12px 14px; font-family: var(--mono); }
textarea:focus, select:focus, input.txt:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgb(255 194 61 / .18); }
summary { color: var(--accent-2); }
a { color: var(--accent-2); }

/* veredito, selos e etiquetas em pílula */
.verdict { background: color-mix(in srgb, var(--vc, var(--info)) 10%, var(--felt-3)); border-radius: 14px; border-left-width: 5px; }
.v-good { --vc: var(--good); } .v-ok { --vc: var(--info); } .v-warn { --vc: var(--warn); } .v-bad { --vc: var(--crit); }
.sev { border-radius: 999px; padding: 4px 10px; }
.sev.s1 { background: var(--info); color: #0b1424; } .sev.s2 { background: var(--warn); color: var(--gold-ink); } .sev.s3 { background: var(--crit); }
.tag { border-radius: 999px; padding: 3px 10px; background: var(--felt-3); }
.tag.cmd { border-color: var(--accent); color: var(--accent-2); }
.cn { border-radius: 999px; padding: 4px 12px; background: var(--felt-3); border: 1px solid var(--line); }
.cn:hover { border-color: var(--c, var(--accent)); background: color-mix(in srgb, var(--c, var(--accent)) 12%, var(--felt-3)); }
.cbox .cn { border: 0; background: none; padding: 0; }
.cn.lock.on { border-color: var(--info); color: var(--info); background: color-mix(in srgb, var(--info) 12%, var(--felt-3)); }

/* números e barras */
.tile { background: linear-gradient(160deg, color-mix(in srgb, var(--tc, var(--info)) 12%, var(--felt-3)), var(--felt-3) 70%); border-radius: 14px; border-left: 0; border-top: 3px solid var(--tc, var(--info)); }
.tile.good { --tc: var(--good); } .tile.warn { --tc: var(--warn); } .tile.bad { --tc: var(--bad); }
.tile b { font-family: var(--display); }
.gauge, .track { background: #0f1220; border-radius: 999px; }
.gauge .band { background: rgb(92 214 143 / .28); border-radius: 999px; }
.track .fill { border-radius: 999px; }
.prog > div { background: linear-gradient(90deg, var(--accent), hsl(16 88% 60%)); box-shadow: 0 0 12px rgb(255 194 61 / .5); }
.ref { border-top-color: var(--line); }
.tw { background: #0f1220; border-radius: 14px; }

/* trocas */
.swapcard { background: rgb(15 18 32 / .7); border-radius: 16px; border: 1px solid var(--line); }
.cimg, .pimg, .hov-img { border-radius: 10px; box-shadow: 0 8px 22px rgb(0 0 0 / .45); }
.ctag { border-radius: 999px; padding: 4px 10px; font-family: var(--mono); font-weight: 600; }
.ctag.in { background: var(--good); color: #0b2316; }
dl.sw-why dd.cmp { border-left-color: var(--accent); }
.noimg { background: repeating-linear-gradient(135deg, var(--felt-3) 0 10px, var(--felt-2) 10px 20px); }

/* caixas flutuantes: o painel escuro do mapa, com o filete dourado */
.pop, .hov, .zoom-box { background: #151927; border: 1px solid #2c3247; border-top: 5px solid var(--accent); border-radius: 18px; box-shadow: 0 20px 60px rgb(0 0 0 / .55); }
.zoom { background: rgb(8 10 18 / .85); backdrop-filter: blur(4px); }

/* mesas */
.op { border-radius: 14px; background: var(--felt-3); }
.op.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--felt-3)); }
.vctl { top: 74px; border-radius: 999px; padding: 8px 12px; background: rgb(23 27 42 / .9); }
.vb { border-radius: 999px; }
.vb.play { background: var(--accent); border-color: var(--accent); color: var(--gold-ink); }
.vlance { background: var(--felt-3); border-left-color: var(--accent); border-radius: 14px; }
.vt { background: #0f1220; color: var(--accent); }
.empty { border-radius: 16px; background: rgb(23 27 42 / .6); }
@media (prefers-reduced-motion: reduce) { .tabs a, .btn { transition: none; } }

/* resumo: os números do deck em destaque, com o preço primeiro */
.stats { display: grid; grid-template-columns: minmax(240px, 2fr) repeat(3, minmax(110px, 1fr)); gap: 14px; margin: 18px 0 14px; }
.stat { display: grid; gap: 4px; align-content: start; padding: 14px 18px; border-radius: 14px; background: var(--felt-3); border: 1px solid var(--line); }
.stat .k { font: 500 .72rem/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.stat b { font: 700 1.7rem/1.1 var(--display); color: var(--ink); }
.stat small { font-size: .84rem; color: var(--ink-3); line-height: 1.4; }
.stat.price { background: linear-gradient(150deg, rgb(255 194 61 / .16), var(--felt-3) 70%); border-color: rgb(255 194 61 / .45); }
.stat.price b { font-size: 2.3rem; color: var(--accent); text-shadow: 0 0 24px rgb(255 194 61 / .35); }
@media (max-width: 760px) { .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); } .stat.price { grid-column: 1 / -1; } .stat { padding: 12px 14px; } }

/* trocas: nível e orçamento */
.nivel { margin-top: 22px; padding: 18px 20px 20px; border-radius: 16px; background: rgb(15 18 32 / .6); border: 1px solid var(--line); }
.nivel h3 { margin-top: 0 !important; }
.nivel-campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px 20px; margin-top: 14px; }
.nivel select { width: 100%; }
.reais { display: flex; align-items: center; gap: 8px; }
.reais i { font: 600 .95rem/1 var(--mono); font-style: normal; color: var(--accent); }
.reais input { min-width: 0; width: 100%; }
.sw-sum { margin: 4px 0 6px; }
.sw-sum .stat b { font-size: 1.5rem; } .sw-sum .stat.price b { font-size: 1.9rem; }
.seta { color: var(--ink-3); font-weight: 500; margin: 0 2px; }

/* ================= trocas: gráficos no estilo do Grimório Arena (18/11/2026) =================
   KPI com antes → depois (verde melhora, vermelho piora), réguas das funções com dois marcadores,
   curva antes × depois sobreposta, e em cada troca: trilho sai × entra com o tracinho da média, barra de preço. */
.bom { color: var(--good); } .ruim { color: var(--bad); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin: 20px 0 8px; }
.kpi { display: grid; gap: 6px; align-content: start; padding: 16px 18px; border-radius: 14px; background: var(--felt-3); border: 1px solid var(--line); border-left: 5px solid var(--line); }
.kpi .k { font: 500 .72rem/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.kpi b { font: 700 1.9rem/1.1 var(--display); color: var(--ink); display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 6px; }
.kpi b .de { font-size: 1.15rem; color: var(--ink-3); font-weight: 600; }
.kpi small { font-size: .84rem; color: var(--ink-3); line-height: 1.45; }
.kpi small .btn { margin-top: 6px; }
.kpi.destaque.bom { border-left-color: var(--good); background: linear-gradient(150deg, color-mix(in srgb, var(--good) 14%, transparent), var(--felt-3) 70%); }
.kpi.destaque.bom b { color: var(--good); }
.kpi.destaque.ruim { border-left-color: var(--bad); background: linear-gradient(150deg, color-mix(in srgb, var(--bad) 14%, transparent), var(--felt-3) 70%); }
.kpi.destaque.ruim b { color: var(--bad); }
.kpi.vazio b { color: var(--ink-3); }

.graf2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; margin: 18px 0 8px; }
@media (max-width: 860px) { .graf2 { grid-template-columns: minmax(0, 1fr); } }
.gbox { padding: 18px 20px 20px; border-radius: 16px; background: rgb(15 18 32 / .6); border: 1px solid var(--line); min-width: 0; }
.gbox h3 { margin: 0 0 4px !important; font-size: 1.05rem; }
.gbox > .note { margin: 0 0 14px; }
.lg-hoje, .lg-dep, .lg-antes { display: inline-block; vertical-align: middle; width: 10px; height: 10px; border-radius: 3px; margin: 0 2px 0 6px; }
.lg-hoje { background: transparent; border: 2px solid var(--ink-2); border-radius: 50%; }
.lg-dep { background: var(--accent); }
.lg-antes { background: transparent; border: 1.5px dashed var(--ink-3); }

.reguas { display: grid; gap: 12px; }
.rg { display: grid; grid-template-columns: minmax(110px, 150px) minmax(0, 1fr) 84px; gap: 12px; align-items: center; }
.rg-n { font-size: .9rem; color: var(--ink-2); }
.rg.igual .rg-n, .rg.igual .rg-v { color: var(--ink-3); }
.rg-t { position: relative; height: 10px; border-radius: 99px; background: var(--felt-3); }
.rg-band { position: absolute; top: 0; bottom: 0; border-radius: 99px; background: color-mix(in srgb, var(--good) 28%, transparent); }
.rg-t i { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; transform: translate(-50%, -50%); }
.rg-hoje { border: 2px solid var(--ink-2); background: var(--felt-2); }
.rg-dep { background: var(--accent); box-shadow: 0 0 0 3px rgb(255 194 61 / .22), 0 0 12px rgb(255 194 61 / .5); }
.rg-dep.ruim { background: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 25%, transparent); }
.rg-v { font: 500 .86rem/1 var(--mono); color: var(--ink-2); text-align: right; white-space: nowrap; }
@media (max-width: 500px) { .rg { grid-template-columns: minmax(0, 1fr) 76px; } .rg-t { grid-column: 1 / -1; grid-row: 2; } }

.curva2 { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; align-items: end; height: 190px; }
.curva2 .col { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; gap: 6px; text-align: center; }
.col-q { font: 600 .9rem/1 var(--mono); color: var(--ink); display: grid; gap: 2px; }
.col-q small { font-size: .7rem; } .col-q .mais { color: var(--accent-2); } .col-q .menos { color: var(--ink-3); }
.col-b { position: relative; }
.col-b i { position: absolute; bottom: 0; border-radius: 5px 5px 2px 2px; }
.col-b .antes { left: 0; right: 0; border: 1.5px dashed var(--ink-3); border-bottom: 0; background: rgb(255 255 255 / .03); }
.col-b .dep { left: 22%; right: 22%; background: linear-gradient(180deg, var(--accent-2), #d9961a); box-shadow: 0 0 14px rgb(255 194 61 / .25); }
.col-l { font: 500 .78rem/1 var(--mono); color: var(--ink-3); }

.sw-num { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1fr); gap: 18px 22px; margin: 18px 0 0; padding: 16px 18px; border-radius: 14px; background: rgb(15 18 32 / .55); border: 1px solid var(--line); }
@media (max-width: 860px) { .sw-num { grid-template-columns: minmax(0, 1fr); } }
.sw-num .eyebrow { display: block; margin-bottom: 10px; }
.sw-num > div > .note { margin: 8px 0 0; }
.swapcard.off .sw-num { opacity: .4; }
.vs-l { display: grid; grid-template-columns: minmax(80px, 170px) minmax(0, 1fr) 42px 40px; gap: 10px; align-items: center; margin-bottom: 8px; }
.vs-n { font-size: .88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 10px; position: relative; }
.vs-n::before { content: ""; position: absolute; left: 0; top: 50%; width: 5px; height: 5px; margin-top: -2.5px; border-radius: 50%; }
.vs-n.sai::before { background: var(--crit); } .vs-n.entra::before { background: var(--good); }
.trilho { position: relative; height: 10px; border-radius: 99px; background: var(--felt-3); }
.trilho i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; }
.trilho i.bom { background: var(--good); } .trilho i.ruim { background: var(--bad); }
.trilho .ref { position: absolute; top: -4px; width: 3px; height: 18px; margin-left: -1.5px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 8px rgb(255 194 61 / .6); }
.vs-p { font: 600 .88rem/1 var(--mono); text-align: right; }
.vs-j { font: 500 .76rem/1 var(--mono); color: var(--ink-3); text-align: right; }
.vs-r { margin-top: 10px !important; }
.pbar { display: grid; gap: 8px; }
.pb-t { position: relative; height: 12px; border-radius: 99px; background: var(--felt-3); }
.pb-t i { position: absolute; top: 0; bottom: 0; border-radius: 99px; }
.pb-t i.eco { background: var(--good); } .pb-t i.soma { background: var(--bad); }
.pb-0 { position: absolute; left: 50%; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink-3); }
.pb-v { font: 600 .95rem/1.2 var(--mono); }
.fxs { display: flex; flex-wrap: wrap; gap: 6px; }
.fx { font: 500 .8rem/1 var(--mono); padding: 5px 10px; border-radius: 99px; background: var(--felt-3); border: 1px solid var(--line); }
.fx.mais { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
.fx.menos { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }

/* ================= aba Análise: Funções + Mana + Plano numa tela só (18/11/2026) ================= */
.subnav { position: sticky; top: 74px; z-index: 12; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 0 auto 18px; padding: 6px; width: fit-content; max-width: 100%;
  border: 1px solid var(--line); border-radius: 999px; background: rgb(18 21 33 / .86); backdrop-filter: blur(10px); }
.subnav a { --hc: hsl(var(--h) 85% 66%); display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 6px; border-radius: 999px; color: var(--ink-2); text-decoration: none; font: 600 .92rem/1 var(--display); }
.subnav a b { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; font: 600 .78rem/1 var(--mono); color: var(--hc); background: color-mix(in srgb, var(--hc) 16%, transparent); }
.subnav a:hover, .subnav a[aria-current="true"] { color: #fff; background: color-mix(in srgb, var(--hc) 20%, transparent); }
.sub { scroll-margin-top: 130px; }
.sub + .sub { margin-top: 34px; padding-top: 30px; border-top: 1px dashed var(--line); }

/* ================= Mesa ao vivo, versão mais legível (18/11/2026) =================
   Terrenos aparecem como cartas (agrupados ×N), cada zona tem nome, contadores com rótulo,
   carta virada não gira mais (fica apagada com o selo "virada"), lances do turno sempre à vista. */
.vleg { display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 10px 14px; font-size: .84rem; color: var(--ink-2); }
.vleg span { display: inline-flex; align-items: center; gap: 7px; }
.vleg .lg { width: 16px; height: 16px; border-radius: 4px; border: 2px solid; }
.lg.vez { border-color: var(--accent); } .lg.alvo { border-color: var(--bad); } .lg.atk { border-color: var(--crit); box-shadow: 0 0 6px var(--crit); } .lg.cmd { border-color: #e7b55c; background: rgb(231 181 92 / .25); }
.lg.tap { border-color: var(--ink-3); background: repeating-linear-gradient(135deg, #0006 0 3px, transparent 3px 6px); }
.lg-pt { font: 700 .72rem/1 var(--mono); background: #f2ead6; color: #1a1612; border-radius: 4px; padding: 3px 4px; }
.s-n i { font-style: normal; font-weight: 600; } .s-vez { color: var(--accent); } .s-alvo { color: var(--bad); }
.s-v { flex-direction: column; height: auto; padding: 5px 12px 6px; gap: 2px; }
.s-v small { font: 500 .62rem/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.s-stats { display: flex; flex-wrap: wrap; gap: 6px; }
.stt { display: inline-flex; align-items: baseline; gap: 6px; padding: 4px 10px; border-radius: 999px; background: rgb(0 0 0 / .28); border: 1px solid rgb(255 255 255 / .07); font-size: .8rem; }
.stt em { font-style: normal; color: var(--ink-3); }
.stt b { font: 600 .84rem/1 var(--mono); color: var(--ink); }
.stt.cmdz b { font-family: var(--body); color: #e7b55c; }
.stt.perigo { border-color: var(--crit); } .stt.perigo b { color: var(--crit); }
.zn { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; padding-top: 10px; border-top: 1px dashed rgb(255 255 255 / .08); }
.zn-k { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; font: 500 .7rem/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.zn-k b { font-size: .82rem; color: var(--ink); letter-spacing: 0; }
.zn-x { text-transform: none; letter-spacing: 0; font-family: var(--body); font-size: .8rem; color: var(--ink-2); }
.zn-x i { font-style: normal; } .novo-t { color: var(--good); } .atk-t { color: var(--crit); font-weight: 600; }
.zn .vazio { font-size: .82rem; color: rgb(235 228 209 / .38); font-style: italic; }
.s-lands2 { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: flex-end; }
.lgrp { position: relative; display: inline-flex; }
.lgrp .mcw { --w: 50px; }
.me .lgrp .mcw { --w: 60px; }
.lq { position: absolute; right: -8px; top: -8px; font: 700 .74rem/1 var(--mono); font-style: normal; padding: 3px 5px; border-radius: 6px; background: var(--accent); color: var(--gold-ink); box-shadow: 0 1px 4px rgb(0 0 0 / .5); z-index: 2; }
.lv { position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); white-space: nowrap; font: 600 .62rem/1 var(--mono); font-style: normal; padding: 2px 5px; border-radius: 5px; background: #000c; color: var(--ink-2); z-index: 2; }
/* carta virada: em vez de girar (o nome ficava de lado), fica apagada e com selo */
.mcw.tap, .me .mcw.tap { width: var(--w); height: auto; }
.mcw.tap .mc, .mc.tap { position: relative; left: auto; top: auto; transform: none; filter: brightness(.68) saturate(.65); }
.mcw.tap .mc.atk { transform: translateY(-10px); }
.mcw.tap .mc::after { content: "virada"; position: absolute; left: 50%; bottom: 14%; transform: translateX(-50%); font: 700 .58rem/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; padding: 3px 5px; border-radius: 4px; background: #000d; color: var(--ink); border: 1px solid rgb(255 255 255 / .3); }
.mc.tap .mpt { transform: none; left: auto; right: -4px; bottom: -6px; }
.mtok b { -webkit-line-clamp: 5; }
.s-gy { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: .8rem; color: var(--ink-3); padding-top: 8px; border-top: 1px dashed rgb(255 255 255 / .08); }
.s-gy em { font-style: normal; }
.s-gy .cn { font-size: .76rem; padding: 2px 9px; background: rgb(0 0 0 / .3); }
.zn-mao .s-mao { border-top: 0; padding-top: 4px; margin-top: 0; }
.j-perg { gap: 12px; }
.j-ops { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.j-ops .jr { display: inline-flex; align-items: center; gap: 8px; }
.j-ops .jr img { width: 34px; border-radius: 3px; }
.j-ops .jr em, .j-chk em { font-style: normal; opacity: .7; }
